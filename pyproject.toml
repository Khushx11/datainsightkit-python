[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datainsightkit"
version = "0.1.0"
description = "Local exploratory analysis for CSV files"
requires-python = ">=3.10"

[project.scripts]
datainsightkit = "datainsightkit.cli:main"

[tool.setuptools.packages.find]
include = ["datainsightkit*"]
